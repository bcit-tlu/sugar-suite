# Reusable workflow: promote a release by retagging an existing
# `sha-<commit>` OCI image to its semver tag (+ `latest` for the
# highest stable release) and cosign-signing it.
#
# Language-agnostic — the source image is retagged by digest without a
# rebuild, so it works for any repo (python, node, etc.) that publishes
# `sha-<commit>` images via oci-build.yaml.

name: "reusable: Release retag (workflow_call only)"

on:
  workflow_call:
    inputs:
      image_name:
        description: "Image name under the repository namespace (e.g. sugar-suite)."
        required: true
        type: string
      tag_name:
        description: "Release tag to retag (e.g. v1.2.3 or backend-v1.2.3)."
        required: true
        type: string
      tag_prefix:
        description: "Tag prefix preceding the semver (e.g. 'v' or 'backend-v'). A tag not matching this prefix is skipped."
        required: false
        type: string
        default: v
      registry:
        description: "OCI registry hosting the image."
        required: false
        type: string
        default: ghcr.io

permissions:
  contents: read

jobs:
  retag:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      REGISTRY: ${{ inputs.registry }}
    steps:
      # Extract the semver from the release tag using the caller's prefix.
      # A tag that doesn't match (e.g. another component's) sets match=false
      # so every subsequent step is skipped.
      - name: Parse release tag
        id: parse
        env:
          TAG: ${{ inputs.tag_name }}
          PREFIX: ${{ inputs.tag_prefix }}
        run: |
          if [[ "$TAG" =~ ^${PREFIX}([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "version=${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.${BASH_REMATCH[3]}" >> "$GITHUB_OUTPUT"
            echo "match=true" >> "$GITHUB_OUTPUT"
          else
            echo "match=false" >> "$GITHUB_OUTPUT"
          fi

      # Full history + tags are needed to compare against all prior releases
      # (highest-stable check below) and to resolve the tag's commit SHA.
      - uses: actions/checkout@v7
        if: steps.parse.outputs.match == 'true'
        with:
          ref: ${{ inputs.tag_name }}
          fetch-depth: 0
          fetch-tags: true

      - name: Check if this is the highest stable release
        id: highest
        if: steps.parse.outputs.match == 'true'
        shell: bash
        env:
          VERSION: ${{ steps.parse.outputs.version }}
          PREFIX: ${{ inputs.tag_prefix }}
        run: |
          # Highest stable (non-prerelease) semver tag for this prefix.
          HIGHEST=$(git tag -l "${PREFIX}[0-9]*.[0-9]*.[0-9]*" \
            | sed "s/^${PREFIX}//" \
            | grep -v -- '-' \
            | sort -V \
            | tail -n1)

          if [[ "${VERSION}" == "${HIGHEST}" ]]; then
            echo "is_highest=true" >> "$GITHUB_OUTPUT"
            echo "${VERSION} is the highest stable release — will tag as latest."
          else
            echo "is_highest=false" >> "$GITHUB_OUTPUT"
            echo "${VERSION} is NOT the highest stable release (highest: ${HIGHEST}) — skipping latest tag."
          fi

      # The source image was published as `sha-<commit>` by oci-build, so map
      # the release tag back to its commit SHA to locate that image.
      - name: Resolve tag commit SHA
        if: steps.parse.outputs.match == 'true'
        id: sha
        env:
          TAG: ${{ inputs.tag_name }}
        run: |
          SHA=$(git rev-list -n1 "${TAG}")
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"

      # Auth to the registry to inspect and retag the source image.
      - uses: docker/login-action@v4
        if: steps.parse.outputs.match == 'true'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Releases can be tagged before the commit's CI image finishes; poll
      # (with backoff, 30m cap) until the `sha-<commit>` image exists.
      - name: Wait for source image
        if: steps.parse.outputs.match == 'true'
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ github.repository }}/${{ inputs.image_name }}
          SHA: ${{ steps.sha.outputs.sha }}
        run: |
          SRC="${IMAGE}:sha-${SHA}"
          DELAY=10
          MAX_DELAY=60
          DEADLINE=$(( $(date +%s) + 1800 ))
          while :; do
            if docker buildx imagetools inspect "${SRC}" >/dev/null 2>&1; then
              echo "Source image ${SRC} is available."
              break
            fi
            if [[ $(date +%s) -ge $DEADLINE ]]; then
              echo "::error::Timed out after 30m waiting for ${SRC} (CI build for $SHA did not publish)."
              exit 1
            fi
            echo "Source image ${SRC} not yet available; retrying in ${DELAY}s..."
            sleep "$DELAY"
            DELAY=$(( DELAY * 2 ))
            if (( DELAY > MAX_DELAY )); then DELAY=$MAX_DELAY; fi
          done

      # Retag the existing image by digest (no rebuild/pull): add the semver
      # tag, plus `latest` when this is the highest stable release.
      - name: Retag (no pull)
        id: retag
        if: steps.parse.outputs.match == 'true'
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ github.repository }}/${{ inputs.image_name }}
          SHA: ${{ steps.sha.outputs.sha }}
          VERSION: ${{ steps.parse.outputs.version }}
          IS_HIGHEST: ${{ steps.highest.outputs.is_highest }}
        run: |
          TAG_ARGS=( -t "${IMAGE}:${VERSION}" )
          if [[ "${IS_HIGHEST}" == "true" ]]; then
            TAG_ARGS+=( -t "${IMAGE}:latest" )
          fi

          docker buildx imagetools create \
            "${TAG_ARGS[@]}" \
            "${IMAGE}:sha-${SHA}"

          # Capture digest for signing.
          DIGEST=$(docker buildx imagetools inspect "${IMAGE}:${VERSION}" --format '{{.Manifest.Digest}}')
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"

      # Sign with Cosign
      - uses: sigstore/cosign-installer@v4
        if: steps.parse.outputs.match == 'true'

      # Keyless-sign the promoted image digest.
      - name: Sign release image
        if: steps.parse.outputs.match == 'true' && steps.retag.outputs.digest != ''
        env:
          IMAGE: ${{ steps.retag.outputs.image }}
          DIGEST: ${{ steps.retag.outputs.digest }}
        run: |
          cosign sign --yes "${IMAGE}@${DIGEST}"

name: pr-title-lint

# Enforce Conventional Commit PR titles so release-please can parse changes.

on:
  pull_request_target:
    types: [opened, edited, reopened, synchronize]
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  # Validate that the PR title follows Conventional Commits. The shared
  # workflow posts/clears a sticky comment explaining any failure.
  lint:
    uses: ./.github/workflows/reusable-pr-title-lint.yaml
    permissions:
      contents: read
      pull-requests: write
    secrets: inherit

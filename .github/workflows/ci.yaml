name: "[CI] Lint, build & publish"

# PR runs show PR title; main runs show head commit subject.
run-name: >-
  ${{ github.event_name == 'pull_request'
      && format('PR #{0} — {1}', github.event.pull_request.number, github.event.pull_request.title)
      || format('Head build — {0}', github.event.head_commit.message) }}

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# Default to least privilege; jobs elevate only when needed.
permissions:
  contents: read

jobs:
  # Chart quality gate

  helm-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: azure/setup-helm@v5

      - name: Install kubeconform
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz \
            | sudo tar xz -C /usr/local/bin kubeconform

      - name: Lint, template-render & validate chart
        run: |
          helm lint charts/
          helm template test charts/ \
            | kubeconform -strict -summary \
                -schema-location default \
                -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
                -ignore-missing-schemas

  # Container image build/publish (reusable workflow)

  build-sugar-suite:
    uses: bcit-tlu/.github/.github/workflows/oci-build.yaml@main
    permissions:
      contents: read
      packages: write
      id-token: write
      security-events: write
      actions: read
    with:
      component: sugar-suite
      image_name: sugar-suite
      context: .
      tag_prefix: "v"
    secrets: inherit

  # Publish chart from main pushes using the image RC version.

  helm-publish:
    needs: [helm-lint, build-sugar-suite]
    if: >-
      github.event_name != 'pull_request'
      && needs.build-sugar-suite.outputs.rc_version != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      REGISTRY: ghcr.io
    steps:
      - uses: actions/checkout@v6

      - uses: azure/setup-helm@v5

      - uses: sigstore/cosign-installer@v3

      - name: Cosign login (OCI)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY: ${{ env.REGISTRY }}
          ACTOR: ${{ github.actor }}
        run: |
          echo "${GITHUB_TOKEN}" | \
            cosign login "${REGISTRY}" \
            -u "${ACTOR}" \
            --password-stdin

      - name: Helm login (OCI)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY: ${{ env.REGISTRY }}
          ACTOR: ${{ github.actor }}
        run: |
          echo "${GITHUB_TOKEN}" | \
            helm registry login "${REGISTRY}" \
            -u "${ACTOR}" \
            --password-stdin

      - name: Package, push & sign chart
        shell: bash
        env:
          VERSION: ${{ needs.build-sugar-suite.outputs.rc_version }}
          OCI_BASE: oci://${{ env.REGISTRY }}/${{ github.repository }}/charts
          IMAGE_BASE: ${{ env.REGISTRY }}/${{ github.repository }}/charts
        run: |
          set -euo pipefail

          CHART_DIR="charts"
          CHART_NAME=$(yq '.name' "${CHART_DIR}/Chart.yaml")
          DEST_DIR="/tmp/charts"
          mkdir -p "${DEST_DIR}"

          # Inject short commit SHA for CDN immutable path (matched by upload prefix).
          SHORT_SHA="$(git rev-parse --short HEAD)"
          yq -i ".cdn.commitSha = \"${SHORT_SHA}\"" \
            "${CHART_DIR}/values.yaml"

          helm package "${CHART_DIR}" \
            --version "${VERSION}" \
            --app-version "${VERSION}" \
            -d "${DEST_DIR}"

          PUSH_OUT=$(helm push \
            "${DEST_DIR}/${CHART_NAME}-${VERSION}.tgz" \
            "${OCI_BASE}" 2>&1) || { echo "${PUSH_OUT}"; exit 1; }
          echo "${PUSH_OUT}"

          # Tolerant digest parse: case-insensitive, allows leading whitespace.
          DIGEST=$(printf '%s\n' "${PUSH_OUT}" \
            | awk 'tolower($1)=="digest:"{print $2; exit}')
          if [[ -z "${DIGEST}" ]]; then
            echo "::error::helm push for ${CHART_NAME} succeeded but no digest found in output (helm output format may have changed)"
            exit 1
          fi

          cosign sign --yes "${IMAGE_BASE}/${CHART_NAME}@${DIGEST}"

  # Upload static assets to Azure CDN blob storage.
  # Only on main; reuses the bcit-ltc/.github reusable workflow.

  # Build static assets locally for CDN upload (Docker build is separate).
  build-assets:
    needs: build-sugar-suite
    if: >-
      github.event_name != 'pull_request'
      && needs.build-sugar-suite.outputs.rc_version != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      short_sha: ${{ steps.set-sha.outputs.short_sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm ci
      - run: npm run build
      - id: set-sha
        run: echo "short_sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Rewrite asset URLs for CDN upload
        env:
          CDN_BASE_URL: "https://bcit-ltc-cdn-h3aafscucgd4dvd3.z03.azurefd.net/bcit-ltc"
          REPO_NAME: ${{ github.event.repository.name }}
          SHORT_SHA: ${{ steps.set-sha.outputs.short_sha }}
          EXT_PATTERN: "css|js|map|jpg|jpeg|png|webp|gif|svg|ico|mp4|woff|woff2|ttf|otf"
        run: |
          set -euo pipefail

          CDN_URL="${CDN_BASE_URL%/}/${REPO_NAME}/${SHORT_SHA}"
          export CDN_URL EXT_PATTERN

          echo "Rewriting dist/ assets to CDN: ${CDN_URL}"

          # HTML rewrite
          find dist -type f -name '*.html' | while read -r f; do
            rel="${f#dist/}"
            rel_dir="$(dirname "$rel")"
            [ "$rel_dir" = "." ] && rel_dir=""
            HTML_DIR="$rel_dir" perl -pi -e '
              my $cdn  = $ENV{CDN_URL}  // q{};
              my $exts = $ENV{EXT_PATTERN} // q{};
              my $dir  = $ENV{HTML_DIR}    // q{};
              exit 0 unless $cdn && $exts;

              my $norm = sub {
                my ($p) = @_;
                my @out;
                for my $seg (split m{/+}, $p) {
                  next if $seg eq q{} || $seg eq q{.};
                  if ($seg eq q{..}) { pop @out if @out; next; }
                  push @out, $seg;
                }
                return join q{/}, @out;
              };

              my $pat = qr{(src|href|data-src)=(["\x27])([^"\x27]+\.(?:$exts)(?:[#?][^"\x27]*)?)\2}i;
              s{$pat}{
                my ($attr, $q, $path) = ($1, $2, $3);
                $path =~ s{^\s+|\s+$}{}g;
                if ($path =~ m{://} || ($cdn ne q{} && index($path, $cdn) == 0) || $path =~ m{^(?:[a-zA-Z][a-zA-Z0-9+.+-]*:|//)}) {
                  "$attr=$q$path$q";
                } else {
                  my $p = $path;
                  $p =~ s{^\./}{};
                  if ($p =~ m{^/}) { $p =~ s{^/}{}; }
                  else { $p = $dir ? "$dir/$p" : $p; }
                  $p = $norm->($p);
                  "$attr=$q$cdn/$p$q";
                }
              }eg;
            ' "$f"
          done

          # CSS rewrite
          find dist -type f -name '*.css' | while read -r f; do
            rel="${f#dist/}"
            rel_dir="$(dirname "$rel")"
            [ "$rel_dir" = "." ] && rel_dir=""
            CSS_DIR="$rel_dir" perl -pi -e '
              my $cdn  = $ENV{CDN_URL}  // q{};
              my $exts = $ENV{EXT_PATTERN} // q{};
              my $dir  = $ENV{CSS_DIR}     // q{};
              exit 0 unless $cdn && $exts;

              my $norm = sub {
                my ($p) = @_;
                my @out;
                for my $seg (split m{/+}, $p) {
                  next if $seg eq q{} || $seg eq q{.};
                  if ($seg eq q{..}) { pop @out if @out; next; }
                  push @out, $seg;
                }
                return join q{/}, @out;
              };

              my $is_abs = sub {
                my ($p) = @_;
                $p =~ s{^\s+|\s+$}{}g;
                return 1 if $p =~ m{://};
                return 1 if $cdn ne q{} && index($p, $cdn) == 0;
                return $p =~ m{^(?:[a-zA-Z][a-zA-Z0-9+.+-]*:|//|data:)}i;
              };

              my $rewrite = sub {
                my ($path) = @_;
                $path =~ s{^\s+|\s+$}{}g;
                return $path if $is_abs->($path);
                my $p = $path;
                $p =~ s{^\./}{};
                if ($p =~ m{^/}) { $p =~ s{^/}{}; }
                else { $p = $dir ? "$dir/$p" : $p; }
                $p = $norm->($p);
                return "$cdn/$p";
              };

              my $url_pat = qr{url\(\s*(["\x27]?)([^"\x27\)]+\.(?:$exts)(?:[#?][^"\x27\)]*)?)\1\s*\)}i;
              s{$url_pat}{
                my ($q, $path) = ($1, $2);
                my $new = $rewrite->($path);
                "url(" . ($q // q{}) . $new . ($q // q{}) . ")";
              }eg;

              my $import_pat = qr{\@import\s+(?:url\()?(["\x27]?)([^"\x27\)]+\.(?:$exts)(?:[#?][^"\x27\)]*)?)\1\)?}i;
              s{$import_pat}{
                my ($q, $path) = ($1, $2);
                my $new = $rewrite->($path);
                "\@import " . ($q // q{}) . $new . ($q // q{});
              }eg;
            ' "$f"
          done

          # JS rewrite
          find dist -type f -name '*.js' | while read -r f; do
            rel="${f#dist/}"
            rel_dir="$(dirname "$rel")"
            [ "$rel_dir" = "." ] && rel_dir=""
            JS_DIR="$rel_dir" perl -pi -e '
              my $cdn  = $ENV{CDN_URL}  // q{};
              my $exts = $ENV{EXT_PATTERN} // q{};
              my $dir  = $ENV{JS_DIR}      // q{};
              exit 0 unless $cdn && $exts;

              my $norm = sub {
                my ($p) = @_;
                my @out;
                for my $seg (split m{/+}, $p) {
                  next if $seg eq q{} || $seg eq q{.};
                  if ($seg eq q{..}) { pop @out if @out; next; }
                  push @out, $seg;
                }
                return join q{/}, @out;
              };

              my $is_abs = sub {
                my ($p) = @_;
                $p =~ s{^\s+|\s+$}{}g;
                return 1 if $p =~ m{://};
                return 1 if $cdn ne q{} && index($p, $cdn) == 0;
                return $p =~ m{^(?:[a-zA-Z][a-zA-Z0-9+.+-]*:|//|data:)}i;
              };

              my $rewrite = sub {
                my ($path) = @_;
                $path =~ s{^\s+|\s+$}{}g;
                return $path if $is_abs->($path);
                my $p = $path;
                $p =~ s{^\./}{};
                if ($p =~ m{^/}) { $p =~ s{^/}{}; }
                else { $p = $dir ? "$dir/$p" : $p; }
                $p = $norm->($p);
                return "$cdn/$p";
              };

              my $str_pat = qr{(["\x27])([^"\x27]+?\.(?:$exts)(?:[#?][^"\x27]*)?)\1}i;
              s{$str_pat}{
                my ($q, $path) = ($1, $2);
                my $new = $rewrite->($path);
                $q . $new . $q;
              }eg;
            ' "$f"
          done

          echo "CDN rewrite complete."

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  cdn-upload:
    needs: build-assets
    uses: bcit-tlu/.github/.github/workflows/cdn-upload.yaml@main
    permissions:
      contents: read
    with:
      dist_dir: "dist"
      artifact_name: "dist"
      destination_prefix: ${{ vars.CDN_NAMESPACE }}/${{ github.event.repository.name }}/${{ needs.build-assets.outputs.short_sha }}
      cdn_account_name: ${{ vars.CDN_ACCOUNT_NAME }}
      cdn_container: ${{ vars.CDN_CONTAINER }}
      asset_extensions: "css,js,map,jpg,jpeg,png,webp,gif,svg,ico,mp4,woff,woff2,ttf,otf"
    secrets:
      CDN_SAS_TOKEN: ${{ secrets.CDN_SAS_TOKEN }}

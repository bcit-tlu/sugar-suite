apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "sugar-suite.fullname" . }}
  labels:
    {{- include "sugar-suite.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "sugar-suite.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "sugar-suite.labels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "sugar-suite.serviceAccountName" . }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- $aff := deepCopy (.Values.affinity | default dict) }}
      {{- if .Values.zoneAntiAffinity.enabled }}
        {{- $zoneRule := dict "labelSelector" (dict "matchLabels" (include "sugar-suite.selectorLabels" . | fromYaml)) "topologyKey" .Values.zoneAntiAffinity.topologyKey }}
        {{- $existing := list }}
        {{- if and (hasKey $aff "podAntiAffinity") $aff.podAntiAffinity }}
          {{- $existing = $aff.podAntiAffinity.requiredDuringSchedulingIgnoredDuringExecution | default list }}
        {{- end }}
        {{- $merged := dict "podAntiAffinity" (dict "requiredDuringSchedulingIgnoredDuringExecution" (append $existing $zoneRule)) }}
        {{- $aff = mustMergeOverwrite $aff $merged }}
      {{- end }}
      {{- if ne (toJson $aff) "{}" }}
      affinity:
        {{- toYaml $aff | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.cdn.enabled }}
      initContainers:
        - name: cdn-rewrite
          image: busybox:1.36
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              echo "Copying original assets to shared volume..."
              cp -a /usr/share/nginx/html/. /html/
              CDN_URL="{{ .Values.cdn.baseUrl }}/{{ .Chart.Name }}/{{ .Values.cdn.commitSha }}"
              echo "Rewriting asset URLs to CDN base: ${CDN_URL}"
              {{- range .Values.cdn.prefixPaths }}
              find /html -name '*.html' -exec \
                sed -i "s|\"{{ . }}/|\"${CDN_URL}/{{ . }}/|g" {} +
              find /html -name '*.html' -exec \
                sed -i "s|'{{ . }}/|'${CDN_URL}/{{ . }}/|g" {} +
              {{- end }}
              echo "CDN rewrite complete."
          volumeMounts:
            - name: html
              mountPath: /html
      {{- end }}
      containers:
        - name: nginx
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.liveness.path }}
              port: http
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.readiness.path }}
              port: http
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
          {{- if .Values.cdn.enabled }}
          volumeMounts:
            - name: html
              mountPath: /usr/share/nginx/html
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- if .Values.cdn.enabled }}
      volumes:
        - name: html
          emptyDir: {}
      {{- end }}

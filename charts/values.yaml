replicaCount: 1

image:
  repository: ghcr.io/bcit-tlu/sugar-suite/sugar-suite
  pullPolicy: IfNotPresent
  tag: "" # Defaults to .Chart.AppVersion

service:
  type: ClusterIP
  port: 8080

serviceAccount:
  create: true
  annotations: {}
  name: ""

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts: []
  tls: []

probes:
  liveness:
    path: /healthz
    initialDelaySeconds: 5
    periodSeconds: 10
  readiness:
    path: /healthz/ready
    initialDelaySeconds: 3
    periodSeconds: 5

resources:
  limits:
    cpu: 100m
    memory: 128Mi
  requests:
    cpu: 50m
    memory: 64Mi

# Optional hard anti-affinity across topology zones.
# Ensure enough distinct zones exist for replicaCount.
zoneAntiAffinity:
  enabled: false
  topologyKey: topology.kubernetes.io/zone

observability:
  openTelemetry:
    collectorEndpoint: "opentelemetry-collector.observability.svc:4318"

# Deploy-time Azure CDN rewrite (initContainer).
# When enabled, an initContainer builds an immutable CDN URL using the
# CI-injected commit SHA (baseUrl + /<Chart.Name>/<sha>), and rewrites
# relative asset URLs in HTML files for the prefixPaths.
cdn:
  enabled: false
  # CDN root domain (e.g. https://<hostname>.azurefd.net/<container>)
  baseUrl: ""
  prefixPaths: []
  # Commit SHA — injected by CI at chart package time (do not set manually).
  commitSha: ""

nodeSelector: {}
tolerations: []
affinity: {}

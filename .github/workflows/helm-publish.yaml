name: helm-publish

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag to package and publish (e.g. v1.2.3)"
        required: true
        type: string

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  # Resolve the short SHA for the release tag so the stable-history update
  # can protect the CDN assets this release points to.
  resolve-stable-sha:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      short_sha: ${{ steps.sha.outputs.short_sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag_name || github.event.release.tag_name }}
      - id: sha
        # Pin --short=7 to match the CI upload prefix and the chart's cdn.commitSha.
        run: echo "short_sha=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

  # Package, push, and sign the Helm chart for a release tag. The shared
  # workflow parses the tag, checks out the matching ref, and injects the
  # short commit SHA into values.yaml for CDN immutable paths.
  publish:
    uses: bcit-tlu/.github/.github/workflows/helm-publish.yaml@main
    permissions:
      contents: read
      packages: write
      id-token: write
    with:
      chart_dir: charts
      tag_name: ${{ inputs.tag_name || github.event.release.tag_name }}
      ref: ${{ inputs.tag_name || github.event.release.tag_name }}
      inject_cdn_sha: true
    secrets: inherit

  # Record this release's SHA as a stable CDN asset set, keeping the last N.
  update-stable-history:
    needs: [publish, resolve-stable-sha]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: bcit-tlu/.github/.github/actions/cdn-stable-history@main
        with:
          cdn_account_name: ${{ vars.CDN_ACCOUNT_NAME }}
          cdn_container: ${{ vars.CDN_CONTAINER }}
          cdn_sas_token: ${{ secrets.CDN_SAS_TOKEN }}
          cdn_namespace: ${{ vars.CDN_NAMESPACE }}
          repo_name: ${{ github.event.repository.name }}
          stable_sha: ${{ needs.resolve-stable-sha.outputs.short_sha }}
          keep_stable: "5"

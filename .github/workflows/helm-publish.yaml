name: helm-publish

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag to package and publish (e.g. v1.2.3). The tag's chart must use the cdn.contentRef schema — pre-migration tags (cdn.commitSha) are rejected. Only tags whose commit completed a latest-channel build resolve via .by-commit."
        required: true
        type: string
      content_ref:
        description: "CDN content ref to promote directly, skipping the .by-commit/<sha> lookup (recovery escape hatch — leave empty normally). The ref must exist under the repo's prefix in the latest account."
        required: false
        type: string
        default: ""

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  # Resolve the release tag to its commit and reject tags whose chart predates the content-ref schema — the publish job injects cdn_content_ref, which cdn.commitSha-era charts can't consume. Runs without an environment so an incompatible tag fails fast instead of waiting on stable approval.
  resolve-tag:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.tag-sha.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag_name || github.event.release.tag_name }}
          persist-credentials: false

      - id: tag-sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Require the content-ref chart schema
        run: |
          if ! grep -q 'cdn\.contentRef' charts/templates/deployment.yaml; then
            echo "::error::${{ inputs.tag_name || github.event.release.tag_name }} uses the pre-migration chart (cdn.commitSha), which this pipeline no longer injects. Cut a patch release from main instead of publishing this tag." >&2
            exit 1
          fi

  # Resolve the release tag's commit to the content ref its latest-channel build produced (.by-commit/<sha>), then server-side copy that prefix from the latest account to the stable account — no rebuild, no re-upload.
  # Runs under the 'stable' environment: that UAMI can read the repo's latest container and write its stable container.
  cdn-promote:
    needs: resolve-tag
    runs-on: ubuntu-latest
    environment: stable
    permissions:
      contents: read
      id-token: write
    outputs:
      content_ref: ${{ steps.promote.outputs.content_ref }}
    steps:
      - name: Azure login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID_STABLE }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          allow-no-subscriptions: true

      - id: promote
        uses: bcit-tlu/.github/.github/actions/cdn-promote@main
        with:
          latest_account: ${{ vars.CDN_ACCOUNT_NAME_LATEST }}
          stable_account: ${{ vars.CDN_ACCOUNT_NAME_STABLE }}
          repo_name: ${{ github.event.repository.name }}
          commit_sha: ${{ needs.resolve-tag.outputs.sha }}
          content_ref: ${{ inputs.content_ref }}

  # Package, push, and sign the Helm chart for a release tag. The shared workflow parses the tag, checks out the matching ref, and injects the promoted content ref into values.yaml for CDN immutable paths.
  publish:
    needs: cdn-promote
    uses: bcit-tlu/.github/.github/workflows/helm-publish.yaml@main
    permissions:
      contents: read
      packages: write
      id-token: write
    with:
      chart_dir: charts
      tag_name: ${{ inputs.tag_name || github.event.release.tag_name }}
      ref: ${{ inputs.tag_name || github.event.release.tag_name }}
      cdn_content_ref: ${{ needs.cdn-promote.outputs.content_ref }}
    secrets: inherit

  # Record this release's content ref as a stable CDN asset set, keeping the last N. Runs only after the promotion copy so the pointer never references missing assets. OIDC auth via azure/login; the action falls back to --auth-mode login.
  update-stable-history:
    needs: [publish, cdn-promote]
    runs-on: ubuntu-latest
    environment: stable
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Azure login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID_STABLE }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          allow-no-subscriptions: true

      - uses: bcit-tlu/.github/.github/actions/cdn-stable-history@main
        with:
          cdn_account_name: ${{ vars.CDN_ACCOUNT_NAME_STABLE }}
          repo_name: ${{ github.event.repository.name }}
          stable_ref: ${{ needs.cdn-promote.outputs.content_ref }}

  # Remove old ref prefixes from the stable container. Protected refs are tracked in .stable-current and .stable-history. Same OIDC auth as promote.
  cdn-cleanup-stable:
    needs: [cdn-promote, update-stable-history]
    runs-on: ubuntu-latest
    environment: stable
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Azure login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID_STABLE }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          allow-no-subscriptions: true

      - uses: bcit-tlu/.github/.github/actions/cdn-cleanup@main
        with:
          cdn_account_name: ${{ vars.CDN_ACCOUNT_NAME_STABLE }}
          channel: stable
          # Must match the stable account's immutability_policy_days in infra-azure (ref younger than 90d cannot be deleted).
          immutable_days: 90
          repo_name: ${{ github.event.repository.name }}
          ref: ${{ needs.cdn-promote.outputs.content_ref }}

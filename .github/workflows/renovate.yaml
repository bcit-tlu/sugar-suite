name: renovate

# Self-hosted Renovate — runs on a schedule via the shared reusable workflow.
# PRs are opened by github-actions[bot]; CI on those PRs needs one-time
# approval from a write-access user (GitHub bot-PR security gate).

on:
  schedule:
    # Every weekday at 09:00 UTC
    - cron: '0 9 * * 1-5'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  renovate:
    uses: bcit-tlu/.github/.github/workflows/renovate.yaml@main
    secrets: inherit

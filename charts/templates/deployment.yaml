apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "sugar-suite.fullname" . }}
  labels:
    {{- include "sugar-suite.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "sugar-suite.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "sugar-suite.labels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "sugar-suite.serviceAccountName" . }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- $aff := deepCopy (.Values.affinity | default dict) }}
      {{- if .Values.zoneAntiAffinity.enabled }}
        {{- $zoneRule := dict "labelSelector" (dict "matchLabels" (include "sugar-suite.selectorLabels" . | fromYaml)) "topologyKey" .Values.zoneAntiAffinity.topologyKey }}
        {{- $existing := list }}
        {{- if and (hasKey $aff "podAntiAffinity") $aff.podAntiAffinity }}
          {{- $existing = $aff.podAntiAffinity.requiredDuringSchedulingIgnoredDuringExecution | default list }}
        {{- end }}
        {{- $merged := dict "podAntiAffinity" (dict "requiredDuringSchedulingIgnoredDuringExecution" (append $existing $zoneRule)) }}
        {{- $aff = mustMergeOverwrite $aff $merged }}
      {{- end }}
      {{- if ne (toJson $aff) "{}" }}
      affinity:
        {{- toYaml $aff | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.cdn.enabled }}
      initContainers:
        - name: cdn-rewrite
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              echo "Copying original assets to shared volume..."
              cp -a /usr/share/nginx/html/. /html/

              CDN_BASE_URL="{{ required "cdn.baseUrl is required when cdn.enabled is true" .Values.cdn.baseUrl }}"
              CDN_SHA="{{ required "cdn.commitSha is required when cdn.enabled is true (injected by CI at chart package time)" .Values.cdn.commitSha }}"
              CDN_URL="${CDN_BASE_URL}/{{ .Chart.Name }}/${CDN_SHA}"
              EXT_PATTERN="{{ join "|" .Values.cdn.assetExtensions }}"

              # Guard: refuse to proceed without an immutable CDN URL (base + sha).
              # Failing here aborts the initContainer so the rollout never serves
              # assets pointing at a hash-less CDN path.
              if [ -z "${CDN_BASE_URL}" ] || [ -z "${CDN_SHA}" ]; then
                echo "ERROR: cdn.baseUrl and cdn.commitSha must both be set." >&2
                exit 1
              fi

              if [ -z "${EXT_PATTERN}" ]; then
                echo "No assetExtensions configured; skipping rewrite."
                exit 0
              fi

              echo "Rewriting asset URLs to CDN: ${CDN_URL}"
              echo "Matching extensions: {{ join "," .Values.cdn.assetExtensions }}"

              export CDN_URL EXT_PATTERN

              # HTML rewrite
              find /html -type f -name '*.html' | while read -r f; do
                rel="${f#/html/}"
                rel_dir="$(dirname "$rel")"
                [ "$rel_dir" = "." ] && rel_dir=""
                HTML_DIR="$rel_dir" perl -pi -e '
                  my $cdn  = $ENV{CDN_URL}  // q{};
                  my $exts = $ENV{EXT_PATTERN} // q{};
                  my $dir  = $ENV{HTML_DIR}    // q{};
                  exit 0 unless $cdn && $exts;

                  my $norm = sub {
                    my ($p) = @_;
                    my @out;
                    for my $seg (split m{/+}, $p) {
                      next if $seg eq q{} || $seg eq q{.};
                      if ($seg eq q{..}) { pop @out if @out; next; }
                      push @out, $seg;
                    }
                    return join q{/}, @out;
                  };

                  my $pat = qr{(src|href|data-src)=(["\x27])([^"\x27]+\.(?:$exts)(?:[#?][^"\x27]*)?)\2}i;
                  s{$pat}{
                    my ($attr, $q, $path) = ($1, $2, $3);
                    $path =~ s{^\s+|\s+$}{}g;
                    if ($path =~ m{://} || ($cdn ne q{} && index($path, $cdn) == 0) || $path =~ m{^(?:[a-zA-Z][a-zA-Z0-9+.+-]*:|//)}) {
                      "$attr=$q$path$q";
                    } else {
                      my $p = $path;
                      $p =~ s{^\./}{};
                      if ($p =~ m{^/}) { $p =~ s{^/}{}; }
                      else { $p = $dir ? "$dir/$p" : $p; }
                      $p = $norm->($p);
                      "$attr=$q$cdn/$p$q";
                    }
                  }eg;
                ' "$f"
              done

              # CSS rewrite
              find /html -type f -name '*.css' | while read -r f; do
                rel="${f#/html/}"
                rel_dir="$(dirname "$rel")"
                [ "$rel_dir" = "." ] && rel_dir=""
                CSS_DIR="$rel_dir" perl -pi -e '
                  my $cdn  = $ENV{CDN_URL}  // q{};
                  my $exts = $ENV{EXT_PATTERN} // q{};
                  my $dir  = $ENV{CSS_DIR}     // q{};
                  exit 0 unless $cdn && $exts;

                  my $norm = sub {
                    my ($p) = @_;
                    my @out;
                    for my $seg (split m{/+}, $p) {
                      next if $seg eq q{} || $seg eq q{.};
                      if ($seg eq q{..}) { pop @out if @out; next; }
                      push @out, $seg;
                    }
                    return join q{/}, @out;
                  };

                  my $is_abs = sub {
                    my ($p) = @_;
                    $p =~ s{^\s+|\s+$}{}g;
                    return 1 if $p =~ m{://};
                    return 1 if $cdn ne q{} && index($p, $cdn) == 0;
                    return $p =~ m{^(?:[a-zA-Z][a-zA-Z0-9+.+-]*:|//|data:)}i;
                  };

                  my $rewrite = sub {
                    my ($path) = @_;
                    $path =~ s{^\s+|\s+$}{}g;
                    return $path if $is_abs->($path);
                    my $p = $path;
                    $p =~ s{^\./}{};
                    if ($p =~ m{^/}) { $p =~ s{^/}{}; }
                    else { $p = $dir ? "$dir/$p" : $p; }
                    $p = $norm->($p);
                    return "$cdn/$p";
                  };

                  my $url_pat = qr{url\(\s*(["\x27]?)([^"\x27\)]+\.(?:$exts)(?:[#?][^"\x27\)]*)?)\1\s*\)}i;
                  s{$url_pat}{
                    my ($q, $path) = ($1, $2);
                    my $new = $rewrite->($path);
                    "url(" . ($q // q{}) . $new . ($q // q{}) . ")";
                  }eg;

                  my $import_pat = qr{\@import\s+(?:url\()?(["\x27]?)([^"\x27\)]+\.(?:$exts)(?:[#?][^"\x27\)]*)?)\1\)?}i;
                  s{$import_pat}{
                    my ($q, $path) = ($1, $2);
                    my $new = $rewrite->($path);
                    "\@import " . ($q // q{}) . $new . ($q // q{});
                  }eg;
                ' "$f"
              done

              # JS rewrite
              find /html -type f -name '*.js' | while read -r f; do
                rel="${f#/html/}"
                rel_dir="$(dirname "$rel")"
                [ "$rel_dir" = "." ] && rel_dir=""
                JS_DIR="$rel_dir" perl -pi -e '
                  my $cdn  = $ENV{CDN_URL}  // q{};
                  my $exts = $ENV{EXT_PATTERN} // q{};
                  my $dir  = $ENV{JS_DIR}      // q{};
                  exit 0 unless $cdn && $exts;

                  my $norm = sub {
                    my ($p) = @_;
                    my @out;
                    for my $seg (split m{/+}, $p) {
                      next if $seg eq q{} || $seg eq q{.};
                      if ($seg eq q{..}) { pop @out if @out; next; }
                      push @out, $seg;
                    }
                    return join q{/}, @out;
                  };

                  my $is_abs = sub {
                    my ($p) = @_;
                    $p =~ s{^\s+|\s+$}{}g;
                    return 1 if $p =~ m{://};
                    return 1 if $cdn ne q{} && index($p, $cdn) == 0;
                    return $p =~ m{^(?:[a-zA-Z][a-zA-Z0-9+.+-]*:|//|data:)}i;
                  };

                  my $rewrite = sub {
                    my ($path) = @_;
                    $path =~ s{^\s+|\s+$}{}g;
                    return $path if $is_abs->($path);
                    my $p = $path;
                    $p =~ s{^\./}{};
                    if ($p =~ m{^/}) { $p =~ s{^/}{}; }
                    else { $p = $dir ? "$dir/$p" : $p; }
                    $p = $norm->($p);
                    return "$cdn/$p";
                  };

                  my $str_pat = qr{(["\x27])([^"\x27]+?\.(?:$exts)(?:[#?][^"\x27]*)?)\1}i;
                  s{$str_pat}{
                    my ($q, $path) = ($1, $2);
                    my $new = $rewrite->($path);
                    $q . $new . $q;
                  }eg;
                ' "$f"
              done

              # Verify the rewrite actually injected the immutable CDN URL into
              # files that contain asset references. Vendor files that reference
              # no assets do not need rewriting, so skip them.
              asset_ref_regex="\.(${EXT_PATTERN})([#?][^\"'\)]*)?([\"'\)]|$)"
              missing_files=$(find /html -type f \( -name '*.html' -o -name '*.css' -o -name '*.js' \) | while read -r f; do
                if grep -qE "${asset_ref_regex}" "$f" && ! grep -qF "${CDN_URL}/" "$f"; then
                  printf '%s\n' "$f"
                fi
              done)
              if [ -n "${missing_files}" ]; then
                echo "ERROR: rewrite did not inject ${CDN_URL}/ into the following files:" >&2
                echo "${missing_files}" >&2
                exit 1
              fi

              echo "CDN rewrite complete."
          volumeMounts:
            - name: html
              mountPath: /html
      {{- end }}
      containers:
        - name: nginx
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.liveness.path }}
              port: http
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.readiness.path }}
              port: http
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
          volumeMounts:
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d
              readOnly: true
            {{- if .Values.cdn.enabled }}
            - name: html
              mountPath: /usr/share/nginx/html
            {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: nginx-conf
          configMap:
            name: {{ include "sugar-suite.fullname" . }}-nginx
        {{- if .Values.cdn.enabled }}
        - name: html
          emptyDir: {}
        {{- end }}
